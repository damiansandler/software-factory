<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipo · Estado del backend</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f5f7;
    color: #1f2937;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  /* Barra del prototipo: no forma parte de la pantalla real */
  .proto-bar {
    background: #111827;
    color: #e5e7eb;
    padding: 10px 16px;
    font-size: 13px;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .proto-bar strong { margin-right: 8px; }
  .proto-bar button {
    background: #374151; color: #f9fafb; border: 1px solid #4b5563;
    border-radius: 6px; padding: 5px 10px; font-size: 13px; cursor: pointer;
  }
  .proto-bar button.active { background: #2563eb; border-color: #2563eb; }
  .proto-bar label { margin-left: auto; display: flex; gap: 6px; align-items: center; }

  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card {
    background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06);
    padding: 32px; width: 100%; max-width: 420px; text-align: center;
  }
  h1 { font-size: 20px; margin: 0 0 24px; }
  .status {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 20px; border-radius: 10px; font-size: 18px; font-weight: 600; min-height: 72px;
  }
  .status.loading { background: #f3f4f6; color: #4b5563; font-weight: 500; }
  .status.ok { background: #ecfdf5; color: #047857; }
  .status.error { background: #fef2f2; color: #b91c1c; font-size: 16px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
  .ok .dot { background: #10b981; }
  .error .dot { background: #ef4444; }
  .spinner {
    width: 18px; height: 18px; border: 3px solid #d1d5db; border-top-color: #6b7280;
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .detail { font-size: 13px; color: #6b7280; margin-top: 10px; min-height: 18px; }
  .retry {
    margin-top: 20px; background: #2563eb; color: #fff; border: none; border-radius: 8px;
    padding: 10px 18px; font-size: 15px; cursor: pointer;
  }
  .retry:disabled { background: #93c5fd; cursor: not-allowed; }
</style>
</head>
<body>

<div class="proto-bar">
  <strong>Prototipo</strong>
  Ver estado:
  <button data-state="loading">Cargando</button>
  <button data-state="ok">Éxito</button>
  <button data-state="error">Error</button>
  <label title="Decide qué pasa al apretar 'Volver a probar'">
    Al reintentar, el backend
    <select id="backendSim">
      <option value="ok">responde ok</option>
      <option value="down">está apagado</option>
      <option value="slow">tarda más de 5 s</option>
      <option value="bad">responde algo raro</option>
    </select>
  </label>
</div>

<main>
  <div class="card">
    <h1>Estado del backend</h1>
    <div id="status" class="status"></div>
    <div id="detail" class="detail"></div>
    <button id="retry" class="retry">Volver a probar</button>
  </div>
</main>

<script>
  // Datos falsos: no hay backend, solo simulamos lo que vería el usuario.
  const statusEl = document.getElementById('status');
  const detailEl = document.getElementById('detail');
  const retryBtn = document.getElementById('retry');
  const sim = document.getElementById('backendSim');
  const protoButtons = document.querySelectorAll('.proto-bar button[data-state]');

  const errorDetails = {
    down: 'El backend no responde. ¿Está prendido?',
    slow: 'El backend tardó más de 5 segundos.',
    bad:  'El backend respondió algo inesperado.',
  };

  function render(state, reason) {
    statusEl.className = 'status ' + state;
    protoButtons.forEach(b => b.classList.toggle('active', b.dataset.state === state));
    if (state === 'loading') {
      statusEl.innerHTML = '<div class="spinner"></div>Consultando al backend…';
      detailEl.textContent = '';
      retryBtn.disabled = true;
    } else if (state === 'ok') {
      statusEl.innerHTML = '<span class="dot"></span>ok';
      detailEl.textContent = 'El backend respondió correctamente.';
      retryBtn.disabled = false;
    } else {
      statusEl.innerHTML = '<span class="dot"></span>No se pudo conectar con el backend';
      detailEl.textContent = errorDetails[reason] || errorDetails.down;
      retryBtn.disabled = false;
    }
  }

  function check() {
    render('loading');
    const outcome = sim.value;
    // "slow" espera los 5 s reales para que se sienta el tiempo máximo.
    const delay = outcome === 'slow' ? 5000 : 1200;
    setTimeout(() => outcome === 'ok' ? render('ok') : render('error', outcome), delay);
  }

  protoButtons.forEach(b => b.addEventListener('click', () => render(b.dataset.state, 'down')));
  retryBtn.addEventListener('click', check);

  check(); // Igual que la página real: consulta apenas carga.
</script>
</body>
</html>
