openapi: 3.1.0
info:
  title: Sandler Factory API
  version: 0.1.0
  description: Contrato del backend. Todo endpoint se documenta aquí antes de implementarse.
servers:
  - url: http://localhost:4000
# Cualquier ruta no documentada responde 404 con el esquema Error.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Indica si el backend está vivo.
      responses:
        "200":
          description: El backend está funcionando.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
        "405":
          description: Método distinto de GET.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          examples: [not_found, method_not_allowed]
    Health:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          const: ok
