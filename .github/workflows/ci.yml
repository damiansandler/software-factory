name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Corre lint, tests y build en cada carpeta que ya tenga package.json.
      # Si algún test necesita Postgres, pedile a Claude que agregue un
      # servicio de base de datos a este workflow.
      - name: Lint, tests y build
        run: |
          for dir in backend frontend; do
            if [ -f "$dir/package.json" ]; then
              echo "== $dir =="
              (cd "$dir" && npm ci && npm run lint --if-present && npm test --if-present && npm run build --if-present)
            fi
          done
